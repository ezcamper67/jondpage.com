<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jon Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single drawing sheet — name block centered in a faint grid field, title block along the bottom edge */
:root {
  --bg: #f5f7f9;
  --sheet: #ffffff;
  --ink: #18202a;
  --muted: #5b6673;
  --line: #d6dde4;
  --grid: rgba(40, 70, 110, 0.06);
  --accent: #2348a8;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --sheet: #151b23; --ink: #e6ebf1; --muted: #93a0ae;
    --line: #2a3440; --grid: rgba(140, 170, 210, 0.06); --accent: #8aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --sheet: #151b23; --ink: #e6ebf1; --muted: #93a0ae;
  --line: #2a3440; --grid: rgba(140, 170, 210, 0.06); --accent: #8aa8ff;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(24px, 6vw, 72px);
}
.sheet {
  max-width: 760px;
  margin: 0 auto;
  background: var(--sheet);
  border: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto auto;
}
.field {
  padding: clamp(40px, 9vw, 96px) clamp(24px, 6vw, 64px);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  display: grid;
  gap: 28px;
}
.label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(44px, 10vw, 84px);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.role {
  margin: 0;
  max-width: 52ch;
  color: var(--muted);
  font-size: 18px;
}
.contact {
  display: grid;
  gap: 12px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}
.contact li {
  display: grid;
  grid-template-columns: 88px 1fr;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}
.contact a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  overflow-wrap: anywhere;
  user-select: text;
}
.contact a:hover { border-bottom-width: 2px; }
.contact a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.titleblock {
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.titleblock div {
  padding: 12px 16px;
  display: grid;
  gap: 2px;
  min-width: 0;
}
.titleblock div + div { border-left: 1px solid var(--line); }
.titleblock strong {
  font-weight: 500;
  font-size: 14px;
}
@media (max-width: 520px) {
  .titleblock { grid-template-columns: 1fr; }
  .titleblock div + div { border-left: 0; border-top: 1px solid var(--line); }
  .contact li { grid-template-columns: 1fr; gap: 2px; }
}
</style>

<main class="sheet">
  <section class="field">
    <span class="label">Portfolio · In progress</span>
    <h1>Jon Page</h1>
    <p class="role">Content strategy, UX, and product ownership for AutoCAD at Autodesk. Project pages for each role are coming soon.</p>
    <ul class="contact">
      <li><span class="label">Email</span><a href="mailto:jonpage@outlook.com">jonpage@outlook.com</a></li>
      <li><span class="label">LinkedIn</span><a href="https://www.linkedin.com/in/jonpage" target="_blank" rel="noopener">linkedin.com/in/jonpage</a></li>
    </ul>
  </section>
  <footer class="titleblock">
    <div><span class="label">Sheet</span><strong>A-000 · Index</strong></div>
    <div><span class="label">Status</span><strong>Placeholder</strong></div>
    <div><span class="label">Based in</span><strong>Benicia, CA</strong></div>
  </footer>
</main>

</body></html>
